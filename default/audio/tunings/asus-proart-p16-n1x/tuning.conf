## ASUS ProArt P16 H7607BA (NVIDIA N1x) internal speakers: a 2-way system.
##
## The woofers are the two Cirrus CS35L56 amplifiers (the Speaker sink, which
## ASUS's amplifier tuning low-passes around 3 kHz); the tweeters are the Cirrus
## CS42L43's speaker amplifier, which Omarchy's UCM profile for this laptop feeds
## from the Headphones sink's port. On Windows, Dolby splits the signal between
## them. This does the same: tone control, a limiter, then a crossover into a
## four-channel node that plays the low band on the woofers and the high band on
## the tweeters.

description="ASUS ProArt P16 (H7607BA) speakers"

## The model number names this exact machine; its DMI product SKU is empty. The
## crossover assumes the woofers run ASUS's amplifier tuning (which low-passes
## them), as on Windows, so match only once that tuning is installed.
asus_proart_p16_amps_tuned() {
  omarchy-hw-match "H7607BA" &&
    compgen -G "/usr/lib/firmware/cirrus/cs35l56-b0-dsp1-misc-10431484-*" >/dev/null
}
match_command=asus_proart_p16_amps_tuned
## Unescaped dots: this is passed to awk as a string, where a backslash escape
## would be consumed before the regex sees it.
sink_pattern='^alsa_output.*mtk_sdw_mc.*HiFi__Speaker__sink$'
## The tweeters, substituted for @COMPANION_SINK@.
companion_sink_pattern='^alsa_output.*mtk_sdw_mc.*HiFi__Headphones__sink$'
## The internal node that splits the graph's four channels onto the two sinks;
## the install checks that it exists rather than following the output to one
## physical sink.
output_node="omarchy_2way_crossover"

## Provenance. Ported from proart-p16-linux's config/pipewire/60-proart-2way.conf
## (Leon Marzoll, GPL-2.0-only), voiced by ear on a P16 under Ubuntu: Linkwitz-
## Riley 4th-order high-pass at 1.8 kHz for the tweeters, a 5.5 kHz shelf, +9 dB,
## and 20.5 ms of delay, measured as the woofers' extra acoustic latency through
## the CS35L56 DSP. The woofers are delayed 1 ms to match the tweeter limiter's
## lookahead.
derived_from="proart-p16-linux 60-proart-2way.conf (GPL-2.0-only, Leon Marzoll), voiced by ear"
validated_by=""
validated_on=""
validated_hardware="ProArt P16 H7607BA, BIOS 300, Ubuntu 26.04 (as a PipeWire drop-in); not yet on Omarchy"

## Not measured with omarchy-audio-tuner yet. Measure on the P16 before this
## leaves the asus-proart-p16-n1x branch.
magnitude_rms_db=""
bass_group_delay_swing_ms=""
limiter_headroom_db=""
