## DRAFT, not loaded: ASUS ProArt P16 H7607BA (NVIDIA N1x) internal speakers,
## woofers and tweeters.
##
## omarchy-audio-tuning only scans the top level of default/audio/tunings, so this
## directory is inert where it is. It becomes the P16 tuning once three things
## have landed and been checked on the machine (see the bring-up plan):
##
##   1. linux-omarchy adds the CS42L43 speaker endpoint (cs42l43-dp6) to the
##      CS35L56 speaker group of the MT8901 "Config 3" machine entry, so the
##      tweeters receive the speaker PCM and the card advertises
##      "spk:...cs42l43-spk" in its components;
##   2. the HiFi-cs42l43-cs35l56x2 UCM profile programs the codec EQ as the 3 kHz
##      Linkwitz-Riley high-pass and routes it to the CS42L43 amplifier on this
##      laptop (the draft profile is in ucm2/ here);
##   3. the tweeter guard in filter-chain.conf has been sized by the stress test.
##
## Then this directory replaces its parent's tuning.conf and filter-chain.conf,
## and the match below keeps the tuning off kernels that predate step 1.

description="ASUS ProArt P16 (H7607BA) speakers, woofers and tweeters"

## As the woofer tuning, plus the kernel's speaker endpoint on the CS42L43: without
## it the tweeters get no signal and this curve would only boost the woofers'
## stop band.
asus_proart_p16_two_way() {
  omarchy-hw-match "H7607BA" &&
    compgen -G "/usr/lib/firmware/cirrus/cs35l56-b0-dsp1-misc-10431484-*" >/dev/null &&
    amixer -c mt8901soundwire info 2>/dev/null | grep -q "cs42l43-spk"
}
match_command=asus_proart_p16_two_way
sink_pattern='^alsa_output.*mtk_sdw_mc.*HiFi__Speaker__sink$'

## Provenance: the whole static speaker block (speaker PEQ and 20-band
## audio-optimizer curve, dynamic profile) of ASUS's Dolby tuning for this
## laptop, SOUNDWIRE_SDCAFUNCTION_10_MAN_01FA_FUNC_4243_SUBSYS_14841043.xml,
## tuning version 45, ASUS Dolby Atmos driver V11.506.650.32. Not voiced by ear.
derived_from="ASUS Dolby Atmos tuning for SUBSYS_14841043 (driver V11.506.650.32)"
validated_by=""
validated_on=""
validated_hardware="none: needs the kernel and UCM changes above first"

## Measured electrically on a copy of this graph feeding a null sink (PipeWire
## 1.6.9, LSP 1.2.35): it matches its design to 0.001 dB across the dense probe,
## where the tweeter guard stays out of the way, and the figure below is its
## deviation from the Dolby curve, level-matched for the 2 dB limiter trim.
magnitude_rms_db="0.11"
bass_group_delay_swing_ms="0.38"
limiter_headroom_db="0.0"   ## worst-case peak on a hot master vs -1 dBFS
## The hot master is pink noise, which carries far more energy above 3 kHz than
## music: the tweeter guard engages on its loud blocks and costs 0.8-1.0 LU over
## two runs (with the guard bypassed the graph loses 0.2 LU, within the
## measurement's noise). Sustained, the guard takes 9.5 dB off a -1 dBFS 6 kHz
## tone and 1.5 dB off -14 dBFS RMS noise above 3 kHz. Re-measure on real
## masters.
dynamic_range_delta_lu="-0.9"
