# DRAFT, not loaded: the ASUS ProArt P16 (N1x) speaker tuning for once its
# tweeters play. omarchy-audio-tuning only reads the top level of a tuning
# directory, so nothing picks this file up; see tuning.conf here for what has to
# be true before it may replace ../filter-chain.conf.
#
# It assumes the tweeters share the speaker stream the way they do on Windows:
# the kernel adds the CS42L43's speaker endpoint to the CS35L56 speaker group,
# so one stereo PCM reaches both amplifiers, and the UCM profile runs the
# CS42L43 output through the codec's own EQ programmed as the 3 kHz
# Linkwitz-Riley high-pass ASUS's Windows codec configuration uses (see
# ucm2/ here). The crossover is then in hardware on both sides -- the
# CS35L56 tuning low-passes the woofers, the codec EQ high-passes the tweeters
# -- and this graph only voices the sum, as Dolby does on Windows.
#
# Voicing: the whole static speaker block of ASUS's Dolby tuning for this
# laptop. The four woofer-band sections are ../filter-chain.conf's, unchanged;
# six more carry the PEQ's 4 kHz and 10 kHz sections exactly and fit the
# optimizer's tweeter bands, together within 0.11 dB RMS of the Dolby curve
# below 16 kHz.
#
# Tweeter guard: the CS42L43 amplifier has no speaker protection in the
# register mode Linux drives it in (no IV sense, no thermal model), so the
# band the tweeters reproduce is split off with the same 3 kHz Linkwitz-Riley
# filters and held to a long-term RMS ceiling by a compressor, then summed back
# (the LR4 pair sums flat). Music does not reach it; sustained full-scale tones
# and noise above 3 kHz do. Threshold -15 dBFS RMS, ratio 8 -- a placeholder
# about a tenth of what the amplifier can deliver into 4 ohms, until the
# tweeter rating is known and the stress test in the bring-up plan has run.
#
# The final limiter holds peaks at -1 dBFS with the same 2 dB input trim as the
# woofer tuning.

context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          { type = builtin name = s0_l      label = bq_peaking   control = { "Freq" = 342 "Q" = 0.696 "Gain" = 2.7 } }
          { type = builtin name = s1_l      label = bq_peaking   control = { "Freq" = 600 "Q" = 2 "Gain" = 2.5 } }
          { type = builtin name = s2_l      label = bq_peaking   control = { "Freq" = 813.3 "Q" = 2.197 "Gain" = 2.22 } }
          { type = builtin name = s3_l      label = bq_peaking   control = { "Freq" = 1716.5 "Q" = 1.358 "Gain" = 1.72 } }
          { type = builtin name = s4_l      label = bq_peaking   control = { "Freq" = 3677.6 "Q" = 2.319 "Gain" = 1.3 } }
          { type = builtin name = s5_l      label = bq_peaking   control = { "Freq" = 4000 "Q" = 3.5 "Gain" = -2 } }
          { type = builtin name = s6_l      label = bq_peaking   control = { "Freq" = 7202 "Q" = 1.311 "Gain" = 3.3 } }
          { type = builtin name = s7_l      label = bq_peaking   control = { "Freq" = 10000 "Q" = 1 "Gain" = 0.5 } }
          { type = builtin name = s8_l      label = bq_peaking   control = { "Freq" = 11350.3 "Q" = 2.144 "Gain" = 4 } }
          { type = builtin name = s9_l      label = bq_peaking   control = { "Freq" = 13794.1 "Q" = 0.959 "Gain" = -7.17 } }
          { type = builtin name = lp1_l     label = bq_lowpass   control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = lp2_l     label = bq_lowpass   control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = hp1_l     label = bq_highpass  control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = hp2_l     label = bq_highpass  control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = sum_l     label = mixer        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

          { type = builtin name = s0_r      label = bq_peaking   control = { "Freq" = 342 "Q" = 0.696 "Gain" = 2.7 } }
          { type = builtin name = s1_r      label = bq_peaking   control = { "Freq" = 600 "Q" = 2 "Gain" = 2.5 } }
          { type = builtin name = s2_r      label = bq_peaking   control = { "Freq" = 813.3 "Q" = 2.197 "Gain" = 2.22 } }
          { type = builtin name = s3_r      label = bq_peaking   control = { "Freq" = 1716.5 "Q" = 1.358 "Gain" = 1.72 } }
          { type = builtin name = s4_r      label = bq_peaking   control = { "Freq" = 3677.6 "Q" = 2.319 "Gain" = 1.3 } }
          { type = builtin name = s5_r      label = bq_peaking   control = { "Freq" = 4000 "Q" = 3.5 "Gain" = -2 } }
          { type = builtin name = s6_r      label = bq_peaking   control = { "Freq" = 7202 "Q" = 1.311 "Gain" = 3.3 } }
          { type = builtin name = s7_r      label = bq_peaking   control = { "Freq" = 10000 "Q" = 1 "Gain" = 0.5 } }
          { type = builtin name = s8_r      label = bq_peaking   control = { "Freq" = 11350.3 "Q" = 2.144 "Gain" = 4 } }
          { type = builtin name = s9_r      label = bq_peaking   control = { "Freq" = 13794.1 "Q" = 0.959 "Gain" = -7.17 } }
          { type = builtin name = lp1_r     label = bq_lowpass   control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = lp2_r     label = bq_lowpass   control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = hp1_r     label = bq_highpass  control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = hp2_r     label = bq_highpass  control = { "Freq" = 3000 "Q" = 0.7071 } }
          { type = builtin name = sum_r     label = mixer        control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

          { type   = lv2
            name   = guard
            plugin = "http://lsp-plug.in/plugins/lv2/compressor_stereo"
            control = {
              # Downward, feed-forward, RMS detection over 100 ms on the louder
              # channel, so each tweeter is held by its own worst case.
              "cm"  = 0
              "sct" = 0
              "scm" = 1
              "scs" = 5
              "scr" = 100
              "al"  = 0.178
              "cr"  = 8
              "at"  = 20
              "rt"  = 500
              "mk"  = 1
            }
          }
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # Both default to enabled: "alr" regulates level toward the
              # threshold and "boost" normalises the threshold up to full
              # scale. A fixed tuning must switch them off or its tone drifts
              # with programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 0.794
              "th"    = 0.891
            }
          }
        ]

        links = [
          { output = "s0_l:Out" input = "s1_l:In" }
          { output = "s1_l:Out" input = "s2_l:In" }
          { output = "s2_l:Out" input = "s3_l:In" }
          { output = "s3_l:Out" input = "s4_l:In" }
          { output = "s4_l:Out" input = "s5_l:In" }
          { output = "s5_l:Out" input = "s6_l:In" }
          { output = "s6_l:Out" input = "s7_l:In" }
          { output = "s7_l:Out" input = "s8_l:In" }
          { output = "s8_l:Out" input = "s9_l:In" }
          { output = "s9_l:Out" input = "lp1_l:In" }
          { output = "s9_l:Out" input = "hp1_l:In" }
          { output = "lp1_l:Out" input = "lp2_l:In" }
          { output = "hp1_l:Out" input = "hp2_l:In" }
          { output = "hp2_l:Out" input = "guard:in_l" }
          { output = "lp2_l:Out" input = "sum_l:In 1" }
          { output = "guard:out_l" input = "sum_l:In 2" }
          { output = "sum_l:Out" input = "limiter:in_l" }

          { output = "s0_r:Out" input = "s1_r:In" }
          { output = "s1_r:Out" input = "s2_r:In" }
          { output = "s2_r:Out" input = "s3_r:In" }
          { output = "s3_r:Out" input = "s4_r:In" }
          { output = "s4_r:Out" input = "s5_r:In" }
          { output = "s5_r:Out" input = "s6_r:In" }
          { output = "s6_r:Out" input = "s7_r:In" }
          { output = "s7_r:Out" input = "s8_r:In" }
          { output = "s8_r:Out" input = "s9_r:In" }
          { output = "s9_r:Out" input = "lp1_r:In" }
          { output = "s9_r:Out" input = "hp1_r:In" }
          { output = "lp1_r:Out" input = "lp2_r:In" }
          { output = "hp1_r:Out" input = "hp2_r:In" }
          { output = "hp2_r:Out" input = "guard:in_r" }
          { output = "lp2_r:Out" input = "sum_r:In 1" }
          { output = "guard:out_r" input = "sum_r:In 2" }
          { output = "sum_r:Out" input = "limiter:in_r" }
        ]

        inputs  = [ "s0_l:In" "s0_r:In" ]
        outputs = [ "limiter:out_l" "limiter:out_r" ]
      }

      audio.channels = 2
      audio.position = [ FL FR ]

      capture.props = {
        node.name   = "omarchy_speaker_tuning"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "omarchy_speaker_tuning_output"
        node.passive  = true
        target.object = "@SPEAKER_SINK@"
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
    }
  }
]
