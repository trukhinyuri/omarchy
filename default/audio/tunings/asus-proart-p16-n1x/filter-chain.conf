# ASUS ProArt P16 H7607BA (NVIDIA N1x) speaker tuning: a 2-way crossover.
#
# The woofers are the CS35L56 amplifiers on the Speaker sink (@SPEAKER_SINK@);
# ASUS's amplifier tuning low-passes them around 3 kHz, so their branch is left
# full range. The tweeters are the CS42L43's speaker amplifier, fed from the
# Headphones sink's port (@COMPANION_SINK@); the asus-proart-p16-tweeters
# service mutes them while headphones are plugged in.
#
#   Laptop Speakers -> tone control -> limiter -+-> 1 ms delay ------------------------> woofers (FL FR)
#                                               +-> LR4 high-pass 1.8 kHz -> shelf ->
#                                                   20.5 ms delay -> +9 dB limiter -> tweeters (RL RR)
#
# The woofers sound 20.5 ms late through the CS35L56 DSP, so the tweeters wait
# for them; the 1 ms on the woofers matches the tweeter limiter's lookahead.
# The tone control is proart-p16-linux's default: +2 dB below 300 Hz, +3 dB at
# 900 Hz and 2.5 kHz.
#
# The four channels go to a combine-stream node that sends FL/FR to the woofers
# and RL/RR to the tweeters, compensating the two sinks' latencies. It is an
# internal sink, so it never shows up as an output to pick: playing into it
# directly would send the full range to the tweeters.

context.modules = [
  { name = libpipewire-module-combine-stream
    args = {
      combine.mode = sink
      node.name = "omarchy_2way_crossover"
      node.description = "Laptop Speakers (crossover)"
      combine.latency-compensate = true
      combine.props = {
        audio.position = [ FL FR RL RR ]
        media.class = "Audio/Sink/Internal"
      }
      stream.props = {
        node.dont-move = true
        node.dont-fallback = true
        node.linger = true
      }
      stream.rules = [
        { matches = [ { node.name = "@SPEAKER_SINK@" } ]
          actions = { create-stream = { combine.audio.position = [ FL FR ] audio.position = [ FL FR ] } }
        }
        { matches = [ { node.name = "@COMPANION_SINK@" } ]
          actions = { create-stream = { combine.audio.position = [ RL RR ] audio.position = [ FL FR ] } }
        }
      ]
    }
  }

  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop Speakers"
      media.name       = "Laptop Speakers"

      filter.graph = {
        nodes = [
          # Tone control
          { type = builtin name = bass_l label = bq_lowshelf control = { "Freq" = 300.0  "Q" = 0.7 "Gain" = 2.0 } }
          { type = builtin name = bass_r label = bq_lowshelf control = { "Freq" = 300.0  "Q" = 0.7 "Gain" = 2.0 } }
          { type = builtin name = mid_l  label = bq_peaking  control = { "Freq" = 900.0  "Q" = 0.8 "Gain" = 3.0 } }
          { type = builtin name = mid_r  label = bq_peaking  control = { "Freq" = 900.0  "Q" = 0.8 "Gain" = 3.0 } }
          { type = builtin name = pres_l label = bq_peaking  control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.0 } }
          { type = builtin name = pres_r label = bq_peaking  control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.0 } }
          # The tone control boosts up to 3 dB, so limit before the split.
          { type   = lv2
            name   = limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              # A fixed tuning must switch off level regulation ("alr") and
              # threshold normalisation ("boost"), or its tone drifts with
              # programme level.
              "alr"   = 0
              "boost" = 0
              "g_in"  = 1.0
              "th"    = 0.891
              "lk"    = 1.0
            }
          }
          # Woofer branch
          { type = builtin name = wdelay_l label = delay config = { "max-delay" = 0.02 } control = { "Delay (s)" = 0.001 } }
          { type = builtin name = wdelay_r label = delay config = { "max-delay" = 0.02 } control = { "Delay (s)" = 0.001 } }
          # Tweeter branch
          { type = builtin name = hp1_l   label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
          { type = builtin name = hp2_l   label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
          { type = builtin name = shelf_l label = bq_highshelf control = { "Freq" = 5500.0 "Q" = 0.7 "Gain" = 1.0 } }
          { type = builtin name = hp1_r   label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
          { type = builtin name = hp2_r   label = bq_highpass  control = { "Freq" = 1800.0 "Q" = 0.707 } }
          { type = builtin name = shelf_r label = bq_highshelf control = { "Freq" = 5500.0 "Q" = 0.7 "Gain" = 1.0 } }
          { type = builtin name = tdelay_l label = delay config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0205 } }
          { type = builtin name = tdelay_r label = delay config = { "max-delay" = 0.05 } control = { "Delay (s)" = 0.0205 } }
          { type   = lv2
            name   = tweeter_limiter
            plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
            control = {
              "alr"   = 0
              "boost" = 0
              "g_in"  = 2.82
              "th"    = 0.891
              "lk"    = 1.0
            }
          }
        ]

        links = [
          { output = "bass_l:Out" input = "mid_l:In" }
          { output = "mid_l:Out"  input = "pres_l:In" }
          { output = "pres_l:Out" input = "limiter:in_l" }
          { output = "bass_r:Out" input = "mid_r:In" }
          { output = "mid_r:Out"  input = "pres_r:In" }
          { output = "pres_r:Out" input = "limiter:in_r" }
          { output = "limiter:out_l" input = "wdelay_l:In" }
          { output = "limiter:out_l" input = "hp1_l:In" }
          { output = "hp1_l:Out"     input = "hp2_l:In" }
          { output = "hp2_l:Out"     input = "shelf_l:In" }
          { output = "shelf_l:Out"   input = "tdelay_l:In" }
          { output = "tdelay_l:Out"  input = "tweeter_limiter:in_l" }
          { output = "limiter:out_r" input = "wdelay_r:In" }
          { output = "limiter:out_r" input = "hp1_r:In" }
          { output = "hp1_r:Out"     input = "hp2_r:In" }
          { output = "hp2_r:Out"     input = "shelf_r:In" }
          { output = "shelf_r:Out"   input = "tdelay_r:In" }
          { output = "tdelay_r:Out"  input = "tweeter_limiter:in_r" }
        ]

        inputs  = [ "bass_l:In" "bass_r:In" ]
        outputs = [ "wdelay_l:Out" "wdelay_r:Out" "tweeter_limiter:out_l" "tweeter_limiter:out_r" ]
      }

      capture.props = {
        node.name      = "omarchy_speaker_tuning"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name        = "omarchy_speaker_tuning_output"
        node.passive     = true
        target.object    = "omarchy_2way_crossover"
        audio.channels   = 4
        audio.position   = [ FL FR RL RR ]
        stream.dont-remix = true
        # Pinned for the same reasons as the other tunings: rerouting "all
        # streams" must not drag the processing onto another output, and the
        # output must wait for the crossover rather than fall back to whatever
        # default exists when the tuning host starts first.
        node.dont-move     = true
        node.dont-fallback = true
        node.linger        = true
      }
    }
  }
]
